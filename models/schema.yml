models:
  - name: dim_listings_cleansed
    description: This table contains the cleansed listings data from Airbnb.
    data_tests:
      - generic_positive_values:
          arguments:
            column_name: listing_id
      - generic_min_row_count:
          arguments:
            min_rows: 1000
          config:
            severity: error

    columns:
      - name: listing_id
        description: The unique identifier for each listing.
        data_tests:
          - not_null
          - unique
      - name: host_id
        description: The host's id which is a foreign key to the hosts dimension table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: room_type
        description: The type of room available for booking.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listings_cleansed_minimum_nights") }}'
        data_tests:
          - generic_positive_values

  - name: dim_hosts_cleansed
    description: This table contains the cleansed hosts data from Airbnb.
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: The unique identifier for each host.
        data_type: integer
      - name: host_name
        description: The name of the host.
        data_type: string
      - name: is_superhost
        description: Indicates if the host is a superhost.
        data_type: string
      - name: updated_at
        description: The timestamp when the host information was last updated.
        data_type: timestamp
      - name: created_at
        description: The timestamp when the host information was created.
        data_type: timestamp